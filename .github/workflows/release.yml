# Ein Tag v<version> wird zum GitHub-Release.
#
# Das Add-on selbst braucht kein Release: Home Assistant baut das Image aus
# dem Dockerfile und bietet ein Update an, sobald `version:` in config.yaml
# auf main steigt. Das Release ist die lesbare Seite dazu — Version, Datum und
# der passende Abschnitt aus chordwright-data/CHANGELOG.md.
#
# Erst testen, dann veröffentlichen: ein Tag auf rotem Code wird kein Release.
# Ein zweiter Lauf auf denselben Tag (Re-run) aktualisiert nur den Text.
#
# Dazu die Programmdateien des Servers (binary.yml): chordwright-server-<rust-target>,
# als .tar.gz bzw. .zip, mit SHA256SUMS. Die beiden für Linux (musl) holt das
# Add-on-Image; deshalb erst taggen und dieses Release abwarten, dann die
# Version in config.yaml auf main bringen (siehe chordwright-data/Dockerfile).

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Erst die Programmdateien, gebaut und getestet auf jeder Plattform — ein Tag
  # auf rotem Code wird kein Release.
  binaries:
    uses: ./.github/workflows/binary.yml

  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, config.yaml, Cargo.toml, package.json und compose.yaml nennen dieselbe Version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          addon=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' chordwright-data/config.yaml)
          pkg=$(node -p "require('./package.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          compose=$(sed -n 's/^ *BUILD_VERSION: *"\(.*\)".*$/\1/p' compose.yaml)
          echo "Tag $tag · config.yaml $addon · Cargo.toml $crate · package.json $pkg · compose.yaml $compose"
          for v in "$addon" "$crate" "$pkg" "$compose"; do
            if [ "$tag" != "$v" ]; then
              echo "::error::Tag $GITHUB_REF_NAME passt nicht zu config.yaml ($addon) / Cargo.toml ($crate) / package.json ($pkg) / compose.yaml ($compose)."
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Abschnitt aus dem Changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 == "## " v { on = 1; next }
            /^## / && on { exit }
            on { print }
          ' chordwright-data/CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::Kein Abschnitt „## ${{ steps.version.outputs.version }}“ in chordwright-data/CHANGELOG.md."
            exit 1
          fi
          cat notes.md

      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Auch einen Entwurf, den jemand in der Oberfläche angelegt hat: das
            # Add-on-Image lädt die Dateien von hier, und an einem Entwurf sind
            # sie für niemanden zu sehen.
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md \
              --tag "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi

  attach:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: chordwright-server-*
          path: bin
          merge-multiple: true
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd bin
          # Ausführbar bleibt eine Datei nur in einem Archiv; ein nackter
          # Download hat kein x-Bit. Windows braucht keins.
          for f in chordwright-server-*; do
            case "$f" in
              *.exe) zip -q "$f.zip" "$f" ;;
              *) chmod +x "$f" && tar -czf "$f.tar.gz" "$f" ;;
            esac
          done
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" *.tar.gz *.zip SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"

  # Das Add-on-Image so, wie Home Assistant es baut: mit dem echten Dockerfile
  # gegen dieses Release, auf beiden Architekturen.
  image:
    needs: attach
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen und starten
        run: |
          docker build --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION="${GITHUB_REF_NAME#v}" \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.20 \
            -t chordwright-data chordwright-data
          .github/check-image.sh chordwright-data
