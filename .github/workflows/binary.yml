# Der Server als Programmdatei je Plattform: statisch für Linux (das ist, was
# das Add-on-Image holt), dazu macOS und Windows zum Starten von Hand.
#
# Jede Datei wird auf ihrer eigenen Plattform gebaut und dort mit denselben
# Tests von außen geprüft (npm test): Dateiüberwachung, atomares Schreiben und
# Pfade verhalten sich unter macOS und Windows anders als unter Linux, und die
# Desktop-App bettet genau diesen Server ein.
#
# Läuft bei jedem Push und PR, die den Server berühren, und als Baustein von
# release.yml, das die Dateien an das Release hängt.

name: binary

on:
  push:
    paths: ['src/**', 'tests/**', 'Cargo.*', 'scripts/**', 'test/**', '.github/workflows/binary.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'Cargo.*', 'scripts/**', 'test/**', '.github/workflows/binary.yml']
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y -q musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Tests gegen die Programmdatei
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          exe=""; [ "${{ runner.os }}" = Windows ] && exe=".exe"
          cp "target/${{ matrix.target }}/release/chordwright-server$exe" "dist/chordwright-server-${{ matrix.target }}$exe"
          CHORDWRIGHT_SERVER_BIN="$PWD/dist/chordwright-server-${{ matrix.target }}$exe" npm test
      - uses: actions/upload-artifact@v4
        with:
          name: chordwright-server-${{ matrix.target }}
          path: dist/chordwright-server-${{ matrix.target }}*
          if-no-files-found: error
