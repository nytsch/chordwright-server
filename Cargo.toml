[package]
name = "chordwright-server"
version = "2.0.0"
description = "A folder of .chordpro files, served to the Chordwright app — with revisions, conflict detection and a Home Assistant add-on."
repository = "https://github.com/nytsch/chordwright-server"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "chordwright_server"

[[bin]]
name = "chordwright-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
gethostname = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
if-addrs = "0.13"
notify = "8"
qrcodegen = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Small and static: the add-on image is this file and little else.
[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
