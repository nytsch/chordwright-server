# Home-Assistant-Add-on für den Chordwright-Datenserver (chordwright-server --addon).
# Anleitung: DOCS.md in diesem Ordner, in Home Assistant unter „Dokumentation".
name: Chordwright Data
version: "2.3.0"
slug: chordwright_data
description: Deine Chordwright-Bibliothek als Ordner mit .chordpro-Dateien.
url: https://github.com/nytsch/chordwright-server
arch:
  - aarch64
  - amd64
startup: application
# Für zwei Fragen an den Supervisor: die IP-Adressen des Rechners, damit sie
# im Zertifikat stehen, und unter welchem Port das Add-on erreichbar ist.
hassio_api: true
boot: auto
# „Web-UI öffnen“: die Bibliotheken mit ihren Zahlen, der QR-Code zum
# Verbinden, weitere Bibliotheken anlegen und verwalten.
ingress: true
ingress_port: 8099
panel_icon: mdi:qrcode
panel_title: Chordwright
ports:
  4174/tcp: 4174
  4175/tcp: 4175
ports_description:
  4174/tcp: Chordwright-Server (in der App unter Einstellungen → Datenquelle)
  4175/tcp: Ohne https, nur für einen Tunnel (Option tunnel)
map:
  # Die Songs liegen unter /share/<ordner> — per Samba sichtbar und editierbar.
  - type: share
    read_only: false
  # Zertifikate, wie sie das Let's-Encrypt- oder DuckDNS-Add-on ablegen.
  - type: ssl
    read_only: true
options:
  token: ""
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  folder: chordwright
  # Weitere Namen oder Adressen fürs Zertifikat, z. B. ha.fritz.box
  hostnames: []
  # Sicherungen der Bibliothek unter share/<ordner>/backups: alle so viele
  # Stunden, wenn sich etwas geändert hat (0 = nur auf Knopfdruck in der App).
  backup_every_hours: 24
  # So viele automatische Sicherungen bleiben; die ältesten gehen.
  backup_keep: 14
  # Für die Band von unterwegs: zusätzlich http auf 4175 für einen Tunnel wie
  # das Cloudflared-Add-on, und die Adresse, unter der er draußen erreichbar
  # ist (z. B. https://songs.example.org). Siehe Dokumentation.
  tunnel: false
  public_url: ""
schema:
  token: password?
  ssl: bool
  certfile: str
  keyfile: str
  folder: match(^[A-Za-z0-9][A-Za-z0-9._-]*$)
  hostnames:
    - str
  backup_every_hours: int(0,)
  backup_keep: int(1,)
  tunnel: bool?
  public_url: str?
